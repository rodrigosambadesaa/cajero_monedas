name: PHP runtime security and syntax
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify patched PHP runtime
        run: |
          php -r '
          $minimum = ["8.3" => 80337, "8.4" => 80428, "8.5" => 80513];
          $branch = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
          if (!isset($minimum[$branch]) || PHP_VERSION_ID < $minimum[$branch]) {
              fwrite(STDERR, "Unpatched PHP: " . PHP_VERSION . PHP_EOL);
              exit(1);
          }
          echo PHP_VERSION . PHP_EOL;
          '
      - name: Lint tracked PHP files without executing application code
        run: git ls-files -z -- '*.php' | xargs -0 -r -n1 php -l
